<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="flags">
        <div class="sqb">
            <h1>Scotland</h1>
        <div class="scotland">
            <div class="square square1"></div>
            <div class="square square2"></div>
        </div>
        <div class="bambo"></div>
    </div>
        <div class="sqb">
            <h1>Filistin</h1>
        <div class="filistin">
            <div class="rec rec1"></div>
            <div class="rec rec2"></div>
            <div class="rec rec3"></div>
            <div class="squaref"></div>
        </div>
        <div class="bambo"></div>
    </div>
        <div class="sqb">
            <h1>Turkey</h1>
        <div class="turkey">
        <div class="moon"></div>
        <div class="moon-inner"></div>
        <div class="star">★</div>
    </div>
        <div class="bambo"></div>
    </div>
        <div class="sqb">
            <h1>Argentina</h1>
        <div class="argentina">
        <div class="stripe sky"></div>
        <div class="stripe white"></div>
        <div class="stripe sky"></div>

        <div class="sun">☀</div>
    </div>
        <div class="bambo"></div>
    </div>
        <div class="sqb">
            <h1>Brazil</h1>
        <div class="brazil">
        <div class="diamond"></div>
        <div class="circle"></div>
    </div>
        <div class="bambo"></div>
    </div>
        <div class="sqb">
            <h1>Norway</h1>
         <div class="norway">
        <div class="white-v"></div>
        <div class="white-h"></div>

        <div class="blue-v"></div>
        <div class="blue-h"></div>
        </div>
        <div class="bambo"></div>
    </div>
    </section>
</body>
</html>
